# Kein Konsolen-Fenster
windows = { console = false, icon = "assets/icon.ico" }
macos = { bundle_identifier = "com.labassistant.app", icon = "assets/icon.icns" }

# Excludes (Platz sparen)
excludes = [
    "pytest", "pytest_*", "unittest", "test", "tests",
    "ipython", "jupyter", "notebook", "jupyterlab",
    "matplotlib", "seaborn", "plotly", "bokeh",
