# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-assistant"
version = "1.0.0"
description = "All-in-One Lab Assistant – Gel-Dokumentation, Laborrechner, Elektronisches Laborbuch, Kalender"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.16"
authors = [{name = "Tabea Homann"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "streamlit>=1.66,<2",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.9",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "tornado>=6.5,<7",
]

[project.optional-dependencies]
ai = ["pytesseract>=0.3.13", "faster-whisper>=1.0", "openai>=1.0"]

[tool.pyinstaller]
# Haupt-Entry-Point
scripts = ["lab_assistant.py"]

# Alle Daten-Dateien & Ordner, die zur Laufzeit gelesen werden
datas = [
    ["components", "components"],
    ["assets", "assets"],
    [".streamlit", ".streamlit"],
    ["locales.py", "."],
    ["models.py", "."],
    ["workflow.py", "."],
    ["canvas_renderer.py", "."],
    ["editor_component.py", "."],
    ["image_processing.py", "."],
    ["lab_assistant.py", "."],
    ["lab_dashboard.py", "."],
    ["lab_calendar.py", "."],
    ["lab_pages.py", "."],
    ["lab_eln.py", "."],
    ["lab_calculators.py", "."],
    ["lab_exports.py", "."],
    ["lab_gel_bridge.py", "."],
    ["lab_synthesis.py", "."],
    ["lab_theme.py", "."],
    ["lab_locales.py", "."],
    ["demo_project.py", "."],
    ["ruff.toml", "."],
]

